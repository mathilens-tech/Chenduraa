name: Deploy to Azure Static Web Apps

# DISABLED — this project currently deploys via .github/workflows/github-pages.yml.
#
# To switch to Azure Static Web Apps:
#   1. Add the AZURE_STATIC_WEB_APPS_API_TOKEN repository secret.
#   2. Replace the `on:` block below with:
#        on:
#          push:
#            branches: [main]
#          pull_request:
#            types: [opened, synchronize, reopened, closed]
#            branches: [main]
#   3. Disable the GitHub Pages workflow so the two do not both publish.
#
# Left as manual-dispatch only so it does not fail on every push while the
# Azure token is absent.
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Site configuration. Add these as GitHub repository *variables*
          # (Settings -> Secrets and variables -> Actions -> Variables).
          # They are compiled into the bundle and are public — never put a
          # secret here.
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_CONTACT_PHONE: ${{ vars.VITE_CONTACT_PHONE }}
          VITE_CONTACT_PHONE_E164: ${{ vars.VITE_CONTACT_PHONE_E164 }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
          VITE_WHATSAPP_E164: ${{ vars.VITE_WHATSAPP_E164 }}
          VITE_OFFICE_CHENNAI_ENABLED: ${{ vars.VITE_OFFICE_CHENNAI_ENABLED }}
          VITE_SOLUTION_INDUSTRIAL_ENABLED: ${{ vars.VITE_SOLUTION_INDUSTRIAL_ENABLED }}
          VITE_SOCIAL_LINKEDIN: ${{ vars.VITE_SOCIAL_LINKEDIN }}
          VITE_SOCIAL_FACEBOOK: ${{ vars.VITE_SOCIAL_FACEBOOK }}
          VITE_SOCIAL_INSTAGRAM: ${{ vars.VITE_SOCIAL_INSTAGRAM }}
          VITE_SOCIAL_YOUTUBE: ${{ vars.VITE_SOCIAL_YOUTUBE }}
          VITE_LEAD_ENDPOINT: ${{ vars.VITE_LEAD_ENDPOINT }}
          VITE_GOOGLE_MAPS_EMBED_KEY: ${{ vars.VITE_GOOGLE_MAPS_EMBED_KEY }}

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: '/'
          api_location: ''
          output_location: 'dist'
          # The build has already run above; don't let Oryx rebuild it.
          skip_app_build: true
          skip_api_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close staging environment
    steps:
      - name: Close
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
